<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Salary Projection Tool</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {--primary-color: #3b82f6;--secondary-color: #10b981;--background-color: #f3f4f6;--text-color: #1f2937;--card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);}
        body {font-family: 'Poppins', sans-serif;background-color: var(--background-color);color: var(--text-color);display: flex;justify-content: center;align-items: center;min-height: 100vh;margin: 0;padding: 20px;}
        .main-container {width: 100%;max-width: 650px;}
        h1 {text-align: center;color: var(--primary-color);font-weight: 700;margin-bottom: 30px;font-size: 2.2rem;}
        .card {background: #ffffff;padding: 30px;border-radius: 12px;box-shadow: var(--card-shadow);margin-bottom: 25px;}
        .form-card h2, .result-card h2 {color: var(--primary-color);margin-top: 0;border-bottom: 1px solid #e5e7eb;padding-bottom: 10px;margin-bottom: 20px;}
        .input-group {display: grid;grid-template-columns: 1fr 1fr;gap: 20px;margin-bottom: 15px;}
        label {display: block;margin-bottom: 5px;font-weight: 600;font-size: 0.95rem;}
        input[type="number"], input[type="text"], select {width: 100%;padding: 12px;margin-top: 5px;border: 2px solid #d1d5db;border-radius: 8px;box-sizing: border-box;transition: border-color 0.3s;}
        input:focus, select:focus {border-color: var(--primary-color);outline: none;}
        button {width: 100%;padding: 15px;background-color: var(--primary-color);color: white;border: none;border-radius: 8px;margin-top: 30px;cursor: pointer;font-size: 1.1rem;font-weight: 600;transition: background-color 0.3s, transform 0.1s;}
        button:hover {background-color: #2563eb;}
        .result-card {text-align: center;border: 2px solid var(--secondary-color);background-color: #ecfdf5;}
        
        #predictionResult {
            font-size: 2.5rem;
            font-weight: 700;
            color: black !important; /* FORCED BLACK */
            margin: 10px 0 0 0;
        }
        
        .result-initial {font-size: 1.2rem !important;color: #9ca3af !important;font-weight: 400 !important;}
        @media (max-width: 600px) {.input-group {grid-template-columns: 1fr;}}
    </style>
</head>
<body>
    <div class="main-container">
        <h1>AI Salary Projection Tool</h1>
        <div class="card form-card">
            <h2>Employee Details</h2>
            <form id="salaryForm">
                <div class="input-group">
                    <label for="age">Age (Years):</label>
                    <input type="number" id="age" name="Age" required min="18" max="70" step="1">
                    <label for="experience">Years of Experience:</label>
                    <input type="number" id="experience" name="Years of Experience" required min="0" max="50" step="0.5">
                </div>
                <div class="input-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="Gender" required>
                        <option value="">-- Select Gender --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <label for="education">Education Level:</label>
                    <select id="education" name="Education Level" required>
                        <option value="">-- Select Education --</option>
                        <option value="High School">High School</option>
                        <option value="Bachelor's Degree">Bachelor's Degree</option>
                        <option value="Master's Degree">Master's Degree</option>
                        <option value="PhD">PhD</option>
                    </select>
                </div>
                <label for="jobTitle">Job Title:</label>
                <input type="text" id="jobTitle" name="Job Title" placeholder="e.g., Data Scientist, AI Engineer" required>
                <button type="submit">Predict Salary</button>
            </form>
        </div>
        <div class="card result-card">
            <h2>Predicted Salary:</h2>
            <p id="predictionResult" class="result-initial" style="color: black !important;">Enter data and click 'Predict Salary'</p>
        </div>
    </div>
    
    <script>
        document.getElementById('salaryForm').addEventListener('submit', async (event) => {
            event.preventDefault(); 
            const resultElement = document.getElementById('predictionResult');
            resultElement.textContent = "Calculating..."; 
            
            // 1. Collect and Prepare Data
            const data = {"Age": document.getElementById('age').value, "Years of Experience": document.getElementById('experience').value, "Gender": document.getElementById('gender').value, "Education Level": document.getElementById('education').value, "Job Title": document.getElementById('jobTitle').value};
            const age = parseFloat(data['Age']);
            const experience = parseFloat(data['Years of Experience']);
            data['Age'] = age;
            data['Years of Experience'] = experience;
            
            // 2. Validation Checks
            if (age < 18) {
                resultElement.textContent = `ERROR: Age must be 18 years or older.`;
                resultElement.style.color = '#dc3545';
                return;
            }

            if (age - experience < 18) {
                resultElement.textContent = `ERROR: Age must exceed Years of Experience by at least 18.`;
                resultElement.style.color = '#dc3545';
                return;
            }

            const API_URL = 'http://127.0.0.1:5000/predict'; 

            try {
                const response = await fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'application/json',}, body: JSON.stringify(data),});
                const result = await response.json();
                if (response.ok) {
                    const formattedSalary = result.predicted_salary.toLocaleString('en-US', {style: 'currency', currency: 'USD', minimumFractionDigits: 2});
                    resultElement.textContent = formattedSalary;
                   
                } else {
                    resultElement.textContent = `Error: ${result.error || 'Check server logs'}`;
                    resultElement.style.color = '#dc3545';
                }
            } catch (error) {
                resultElement.textContent = `Connection failed. Ensure the server is running.`;
                resultElement.style.color = '#dc3545';
                console.error('Fetch error:', error);
            }
        });
    </script>
</body>
</html>
